<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="760" viewBox="0 0 2200 760" role="img" aria-labelledby="title desc">
  <title id="title">Quadcopter Drone Control Loop</title>
  <desc id="desc">Detailed drone-side control loop: sensing, comm/vitals, timing, mode logic, estimation, PID control, and actuation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#f3f3f3"/>
    </marker>
    <style>
      .bg { fill: #050414; }
      .zone { fill: none; stroke: #d8d8d8; stroke-width: 2.5; stroke-dasharray: 10 8; }
      .card { fill: #141414; stroke: #f3f3f3; stroke-width: 3; }
      .soft { fill: #0f1020; stroke: #cfcfcf; stroke-width: 2.2; }
      .title {
        font-family: "Comic Sans MS", "Marker Felt", "Bradley Hand", cursive;
        font-size: 46px;
        font-weight: 700;
        fill: #f3f3f3;
      }
      .section {
        font-family: "Comic Sans MS", "Marker Felt", "Bradley Hand", cursive;
        font-size: 34px;
        font-weight: 700;
        fill: #f3f3f3;
      }
      .label {
        font-family: "Comic Sans MS", "Marker Felt", "Bradley Hand", cursive;
        font-size: 24px;
        font-weight: 700;
        fill: #f3f3f3;
      }
      .small {
        font-family: "Comic Sans MS", "Marker Felt", "Bradley Hand", cursive;
        font-size: 19px;
        fill: #d7d7d7;
      }
      .flow {
        stroke: #f3f3f3;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }
      .flow-soft {
        stroke: #cccccc;
        stroke-width: 2.2;
        fill: none;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect class="bg" width="2200" height="760"/>
  <text x="1100" y="64" text-anchor="middle" class="title">Drone Firmware Control Loop (Detailed)</text>

  <rect x="60" y="100" width="2080" height="570" rx="12" class="zone"/>
  <text x="90" y="146" class="section">Per-Iteration Execution (4 ms loop in raw mode)</text>

  <rect x="110" y="250" width="260" height="120" rx="14" class="card"/>
  <text x="240" y="308" text-anchor="middle" class="label">1. Gather Sensors</text>
  <text x="240" y="334" text-anchor="middle" class="small">DMP + RAW IMU + barometer</text>

  <rect x="430" y="250" width="260" height="120" rx="14" class="card"/>
  <text x="560" y="308" text-anchor="middle" class="label">2. UART + Vitals</text>
  <text x="560" y="334" text-anchor="middle" class="small">commands, battery, link health</text>

  <rect x="750" y="250" width="220" height="120" rx="14" class="card"/>
  <text x="860" y="308" text-anchor="middle" class="label">3. delta_t</text>
  <text x="860" y="334" text-anchor="middle" class="small">sample time update</text>

  <rect x="1030" y="250" width="300" height="120" rx="14" class="card"/>
  <text x="1180" y="308" text-anchor="middle" class="label">4. Mode Logic</text>
  <text x="1180" y="334" text-anchor="middle" class="small">Safe / Panic / Manual / Full / Raw / Height</text>

  <rect x="1390" y="250" width="300" height="120" rx="14" class="card"/>
  <text x="1540" y="308" text-anchor="middle" class="label">5. State Estimation</text>
  <text x="1540" y="334" text-anchor="middle" class="small">DMP, Mahony (200 Hz), Kalman</text>

  <rect x="1750" y="250" width="250" height="120" rx="14" class="card"/>
  <text x="1875" y="308" text-anchor="middle" class="label">6. Axis PID</text>
  <text x="1875" y="334" text-anchor="middle" class="small">roll / pitch / yaw</text>

  <rect x="910" y="460" width="380" height="120" rx="14" class="card"/>
  <text x="1100" y="518" text-anchor="middle" class="label">7. Actuation Mixer</text>
  <text x="1100" y="544" text-anchor="middle" class="small">lift + roll + pitch + yaw -> ae1..ae4</text>

  <path class="flow" d="M370 310 L430 310"/>
  <path class="flow" d="M690 310 L750 310"/>
  <path class="flow" d="M970 310 L1030 310"/>
  <path class="flow" d="M1330 310 L1390 310"/>
  <path class="flow" d="M1690 310 L1750 310"/>
  <path class="flow" d="M1875 370 L1875 420 L1290 420 L1290 505"/>

  <path class="flow-soft" d="M1180 370 L1180 460"/>
  <text x="1212" y="424" class="small">manual/full/raw/height output</text>

  <rect x="120" y="460" width="300" height="120" rx="12" class="soft"/>
  <text x="270" y="518" text-anchor="middle" class="label">Flash Logger</text>
  <text x="270" y="544" text-anchor="middle" class="small">record sensor + DMP traces</text>

  <rect x="480" y="460" width="360" height="120" rx="12" class="soft"/>
  <text x="660" y="518" text-anchor="middle" class="label">Safety Watchdog</text>
  <text x="660" y="544" text-anchor="middle" class="small">250 ms link timeout -> panic ramp-down</text>

  <path class="flow-soft" d="M240 370 L240 460"/>
  <path class="flow-soft" d="M560 370 L560 460"/>
  <path class="flow-soft" d="M1030 310 L840 310 L840 520"/>
  <text x="820" y="410" text-anchor="end" class="small">panic override</text>

  <path class="flow" d="M990 580 L990 640"/>
  <path class="flow" d="M1060 580 L1060 640"/>
  <path class="flow" d="M1130 580 L1130 640"/>
  <path class="flow" d="M1200 580 L1200 640"/>
  <text x="990" y="664" text-anchor="middle" class="small">ae1</text>
  <text x="1060" y="664" text-anchor="middle" class="small">ae2</text>
  <text x="1130" y="664" text-anchor="middle" class="small">ae3</text>
  <text x="1200" y="664" text-anchor="middle" class="small">ae4</text>
</svg>
