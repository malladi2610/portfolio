<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1220" viewBox="0 0 2100 1220" role="img" aria-labelledby="title desc">
  <title id="title">HAIREMS Monitoring Flow</title>
  <desc id="desc">Reference-faithful HAIREMS block diagram with oxygen, saline, and emergency sound flows converging into mobile application and alerts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#dfe9ff"/>
    </marker>
    <style>
      .bg { fill: #050414; }
      .box { fill: #111a32; stroke: #81a9eb; stroke-width: 2.2; }
      .box-warm { fill: #2a2014; stroke: #d2a56d; stroke-width: 2.2; }
      .box-alert { fill: #2a1322; stroke: #e486ab; stroke-width: 2.2; }
      .box-app { fill: #13261f; stroke: #78bf95; stroke-width: 2.4; }
      .title {
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        font-size: 44px;
        font-weight: 700;
        fill: #e9f2ff;
      }
      .section {
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        font-size: 31px;
        font-weight: 700;
        fill: #d9e7ff;
      }
      .label {
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        font-size: 28px;
        font-weight: 700;
        fill: #edf5ff;
      }
      .small {
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        font-size: 22px;
        fill: #d1ddf6;
      }
      .tiny {
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        font-size: 18px;
        fill: #c4d3ef;
      }
      .flow {
        stroke: #dfe9ff;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect class="bg" width="2100" height="1220"/>

  <!-- Left cluster -->
  <text x="330" y="110" text-anchor="middle" class="section">Oxygen Level Monitor</text>
  <rect x="210" y="180" width="240" height="90" rx="10" class="box"/>
  <text x="330" y="236" text-anchor="middle" class="label">NodeMCU</text>

  <rect x="460" y="330" width="230" height="90" rx="10" class="box-warm"/>
  <text x="575" y="386" text-anchor="middle" class="small">Pressure sensor</text>

  <rect x="60" y="320" width="300" height="170" rx="10" class="box"/>
  <text x="210" y="377" text-anchor="middle" class="small">Send current pressure</text>
  <text x="210" y="405" text-anchor="middle" class="small">to Blynk cloud</text>

  <rect x="70" y="560" width="280" height="120" rx="10" class="box-alert"/>
  <text x="210" y="614" text-anchor="middle" class="small">Send a mail to</text>
  <text x="210" y="642" text-anchor="middle" class="small">concerned authority</text>

  <path class="flow" d="M465 350 L350 270"/>
  <path class="flow" d="M250 270 L180 320"/>
  <path class="flow" d="M210 490 L210 560"/>
  <rect x="18" y="514" width="300" height="30" rx="6" fill="#050414" opacity="0.92"/>
  <text x="28" y="535" class="tiny">if pressure is below threshold</text>

  <!-- Center cluster -->
  <text x="1040" y="110" text-anchor="middle" class="section">Saline Level Detector</text>
  <rect x="920" y="180" width="240" height="90" rx="10" class="box"/>
  <text x="1040" y="236" text-anchor="middle" class="label">NodeMCU</text>

  <rect x="1200" y="290" width="190" height="78" rx="10" class="box-warm"/>
  <text x="1295" y="338" text-anchor="middle" class="small">IR sensor</text>

  <rect x="780" y="390" width="270" height="120" rx="10" class="box"/>
  <text x="915" y="446" text-anchor="middle" class="small">Send saline level</text>
  <text x="915" y="474" text-anchor="middle" class="small">data to cloud</text>

  <rect x="1080" y="390" width="270" height="120" rx="10" class="box-warm"/>
  <text x="1215" y="446" text-anchor="middle" class="small">Turn on servo to</text>
  <text x="1215" y="474" text-anchor="middle" class="small">reduce flow</text>

  <path class="flow" d="M1200 329 L1080 270"/>
  <path class="flow" d="M1010 270 L920 390"/>
  <path class="flow" d="M1080 270 L1215 390"/>

  <!-- Right cluster -->
  <text x="1740" y="110" text-anchor="middle" class="section">Emergency/Panic Sound Detector</text>
  <rect x="1600" y="160" width="280" height="100" rx="10" class="box"/>
  <text x="1740" y="208" text-anchor="middle" class="small">Arduino Nano 33 BLE Sense</text>
  <text x="1740" y="234" text-anchor="middle" class="tiny">sound classification</text>

  <rect x="1600" y="330" width="260" height="90" rx="10" class="box"/>
  <text x="1730" y="386" text-anchor="middle" class="label">NodeMCU</text>

  <rect x="1600" y="490" width="280" height="120" rx="10" class="box"/>
  <text x="1740" y="546" text-anchor="middle" class="small">Send recognised class</text>
  <text x="1740" y="574" text-anchor="middle" class="small">data to Blynk cloud</text>

  <rect x="1770" y="680" width="250" height="100" rx="10" class="box-alert"/>
  <text x="1895" y="736" text-anchor="middle" class="small">Make a phone call</text>

  <path class="flow" d="M1740 260 L1730 330"/>
  <path class="flow" d="M1730 420 L1740 490"/>
  <path class="flow" d="M1840 610 L1895 680"/>
  <rect x="1652" y="642" width="250" height="30" rx="6" fill="#050414" opacity="0.92"/>
  <text x="1662" y="663" class="tiny">in case of emergency</text>

  <!-- Mobile app sink -->
  <rect x="790" y="870" width="520" height="150" rx="12" class="box-app"/>
  <text x="1050" y="955" text-anchor="middle" class="label">Mobile Application</text>

  <path class="flow" d="M300 490 L920 870"/>
  <path class="flow" d="M915 510 L980 870"/>
  <path class="flow" d="M1600 610 L1130 870"/>
</svg>
