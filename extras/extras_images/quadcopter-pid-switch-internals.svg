<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="620" viewBox="0 0 1800 620" role="img" aria-labelledby="title desc">
  <title id="title">PID Switch Internals</title>
  <desc id="desc">Internal block logic of PID switch: direct thresholded path, feedback PID path, and output component signal.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#f3f3f3"/>
    </marker>
    <style>
      .bg { fill: #050414; }
      .zone { fill: none; stroke: #d8d8d8; stroke-width: 2.5; stroke-dasharray: 10 8; }
      .card { fill: #141414; stroke: #f3f3f3; stroke-width: 3; }
      .soft { fill: #0f1020; stroke: #cfcfcf; stroke-width: 2.2; }
      .title {
        font-family: "Comic Sans MS", "Marker Felt", "Bradley Hand", cursive;
        font-size: 44px;
        font-weight: 700;
        fill: #f3f3f3;
      }
      .label {
        font-family: "Comic Sans MS", "Marker Felt", "Bradley Hand", cursive;
        font-size: 30px;
        font-weight: 700;
        fill: #f3f3f3;
      }
      .small {
        font-family: "Comic Sans MS", "Marker Felt", "Bradley Hand", cursive;
        font-size: 21px;
        fill: #d7d7d7;
      }
      .flow {
        stroke: #f3f3f3;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }
      .flow-soft {
        stroke: #cccccc;
        stroke-width: 2.2;
        fill: none;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect class="bg" width="1800" height="620"/>
  <text x="900" y="64" text-anchor="middle" class="title">PID Switch Internals</text>

  <rect x="160" y="120" width="1480" height="430" rx="12" class="zone"/>
  <text x="200" y="166" class="label">PID Switch</text>

  <path class="flow" d="M180 330 L380 330"/>
  <text x="172" y="316" text-anchor="end" class="small">Joystick Signal</text>

  <!-- Split node -->
  <circle cx="420" cy="330" r="6" fill="#f3f3f3"/>

  <!-- Upper (direct) branch -->
  <path class="flow-soft" d="M420 330 L620 250"/>
  <circle cx="660" cy="250" r="30" class="soft"/>
  <text x="660" y="260" text-anchor="middle" class="label">x</text>
  <path class="flow-soft" d="M690 250 L980 250"/>
  <text x="660" y="205" text-anchor="middle" class="small">Component Threshold</text>
  <path class="flow-soft" d="M660 190 L660 220"/>

  <!-- Lower (feedback) branch -->
  <path class="flow-soft" d="M420 330 L580 400"/>
  <circle cx="620" cy="400" r="30" class="soft"/>
  <text x="620" y="410" text-anchor="middle" class="label">+</text>
  <path class="flow-soft" d="M650 400 L800 400"/>
  <rect x="800" y="365" width="240" height="70" rx="10" class="card"/>
  <text x="920" y="410" text-anchor="middle" class="label">PID</text>
  <path class="flow-soft" d="M1040 400 L1180 400 L1260 330"/>
  <text x="620" y="462" text-anchor="middle" class="small">Quantity Threshold</text>
  <path class="flow-soft" d="M560 450 L590 420"/>

  <!-- Merge + output -->
  <path class="flow-soft" d="M980 250 L1180 250 L1260 330"/>
  <path class="flow" d="M1260 330 L1620 330"/>
  <text x="1628" y="316" class="small">Component Signal</text>

  <!-- Feedback measurement -->
  <path class="flow-soft" d="M1260 330 L1260 480 L540 480 L540 420 L590 420"/>
  <text x="1040" y="505" class="small">Measurement feedback</text>
</svg>
