name = "portfolio-visitor-tracker"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

# Use a workers.dev endpoint unless itsmns.dev is moved to Cloudflare DNS.
# If itsmns.dev is proxied through Cloudflare later, replace this with:
# routes = [{ pattern = "itsmns.dev/api/*", zone_name = "itsmns.dev" }]

[vars]
SITE_ORIGIN = "https://itsmns.dev"
STORE_RAW_IP = "false"
EMAIL_FROM = "notifications@itsmns.dev"
EMAIL_TO = "malladisubhash2610@gmail.com"
EMAIL_NOTIFICATIONS = "true"
WEBHOOK_FORMAT = "generic"

[[d1_databases]]
binding = "DB"
database_name = "portfolio_visitor_tracking"
database_id = "07a1677b-8036-42d4-bcae-a3093f6008a1"

# Requires Cloudflare Email Routing to be enabled for itsmns.dev and EMAIL_TO
# to be a verified destination address.
[[send_email]]
name = "NOTIFICATION_EMAIL"
destination_address = "malladisubhash2610@gmail.com"
